  # Commodity keyword → affected NSE tickers
  # primary: direct beneficiaries/victims; secondary: indirect exposure
  commodity_mappings:
    crude_oil:
      primary: [ONGC, OIL]              # upstream E&P: benefit from high crude
      secondary: [BPCL, HINDPETRO, IOC] # downstream OMC: hurt by high crude
    gold:
      primary: [GOLDBEES]               # gold ETF proxy
      secondary: [TITAN, RAJESHEXPO]    # jewelry demand play
    natural_gas:
      primary: [GAIL, IGL, MGL]
    silver:
      primary: [SILVERETF]
    coal:
      primary: [COALINDIA]
      secondary: [NTPC, TATAPOWER]      # coal-fired power generation


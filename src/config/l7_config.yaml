layer_7:
  # Data collection settings
  screener_request_delay_s: 1.5   # seconds between screener.in requests (anti-ban)
  max_peers: 4                    # peer tickers to collect per target ticker
  price_history_days: 200         # days of history for 200-DMA computation
  max_corporate_actions: 3        # last N NSE corporate actions per ticker
  max_recent_filings: 2           # last N material NSE announcements per ticker
  max_workers: 4                  # parallel threads for yfinance + NSE API (NOT screener)
  nse_symbols_refresh_days: 7     # how often to refresh the NSE equity cache

  # NSE announcement types that count as material for investors.
  # Anything not in this list is skipped during filing collection.
  # Add/remove keywords here — no code change needed.
  material_announcement_types:
    - board meeting
    - financial results
    - dividend
    - buyback
    - change in director
    - change in management
    - merger
    - acquisition
    - demerger
    - rights issue
    - bonus
    - split
    - open offer
    - delisting
    - credit rating
    - order won
    - loss of order
    - outcome of board meeting
    - press release

  # Colloquial aliases that fuzzy matching misses (abbreviations, brand names, common short forms).
  # Key: what users/LLMs write → Value: NSE ticker symbol.
  # Add new entries here when a target comes back unresolved — no code change needed.

# config/phase_a.yaml — Phase A: Broad Market Discovery
#
# All runtime config for run_phase_a.py lives here.
# Edit this file to add/remove sources, tune limits, toggle channels.
# No Python code needs to change.


# ── F&O index snapshots ───────────────────────────────────────────────────────
fno:
  symbols:
    - NIFTY
    - BANKNIFTY


# ── Moneycontrol article scraper ──────────────────────────────────────────────
# Category names must match the keys in moneycontrol.CATEGORIES inside the module.
# max_pages: listing pages to walk (more pages = older articles)
# days_back: skip articles older than this many days (1 = today only)
moneycontrol:
  max_pages: 5    # hard cap — date-based stopping usually kicks in first
  days_back: 2
  categories:
    - markets
    - stocks
    - earnings
    - economy
    - companies
    - india
    - mutual_funds
    - commodities
    - ipo


# ── Economic Times article scraper ───────────────────────────────────────────
# Category names must match the keys in economic_times.CATEGORIES inside the module.
economic_times:
  max_pages: 5    # hard cap — date-based stopping usually kicks in first
  days_back: 2
  categories:
    - stocks_news
    - expert_view
    - stocks_recos
    - commodities


# ── RSS feeds ─────────────────────────────────────────────────────────────────
# key: used as the output filename prefix
# value: feed URL
# Feeds without summaries (yahoo, investing.com) still give useful title + URL signals.
rss_feeds:
  # Indian markets (include article summaries)
  mint_markets:        "https://www.livemint.com/rss/markets"
  mint_companies:      "https://www.livemint.com/rss/companies"
  mint_economy:        "https://www.livemint.com/rss/economy"
  hindu_bizline:       "https://www.thehindubusinessline.com/markets/?service=rss"
  ndtv_profit:         "https://feeds.feedburner.com/ndtvprofit-latest"
  et_markets:          "https://economictimes.indiatimes.com/markets/stocks/news/rssfeeds/2143429.cms"
  et_top_stories:      "https://economictimes.indiatimes.com/rssfeedsdefault.cms"
  moneycontrol_news:   "https://www.moneycontrol.com/rss/latestnews.xml"
  moneycontrol_biz:    "https://www.moneycontrol.com/rss/business.xml"
  # Global (title + URL only, no summaries)
  yahoo_finance:       "https://finance.yahoo.com/rss/topfinstories"
  investing_com:       "https://in.investing.com/rss/news_25.rss"


# ── News APIs (query-based, returns title + description — not full body) ──────
#
# newsdata.io: 200 credits/day free — 1 credit per query call.
newsdata_io:
  queries:
    - "Nifty Sensex stock market India"
    - "NSE BSE earnings results quarterly"
    - "RBI monetary policy India economy"
    - "FII DII institutional flows India"

# mediastack: 500 requests/month — use sparingly.
mediastack:
  queries:
    - "Nifty Sensex"
    - "NSE earnings results"


# ── Gmail newsletters ─────────────────────────────────────────────────────────
# limit: emails to fetch per source
# Each source uses either from_domain OR subject_keyword to find emails.
gmail:
  limit: 5
  sources:
    - from_domain:     "busline.hindugroup.org"
      label:           "Hindu BusinessLine"
    - subject_keyword: "Mint Morning Briefing"
      label:           "Mint Morning"
    - subject_keyword: "Morning Dispatch"
      label:           "ET Morning"
    - subject_keyword: "Moneycontrol Markets"
      label:           "MC Markets"


# ── YouTube channels ──────────────────────────────────────────────────────────
# days_back: only pull videos published in the last N days
# max_medium: videos per channel with duration 4–20 min (excludes Shorts)
# max_long:   videos per channel with duration 20+ min (deep dives, full shows)
